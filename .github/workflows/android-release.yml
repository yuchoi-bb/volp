name: Android Release

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4

      - name: 서명 키스토어 복원
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 시크릿이 없어 디버그 키로 빌드한다." >&2
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/volp-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/volp-release.jks" >> "$GITHUB_ENV"

      - name: 단위 테스트
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: 릴리스 APK 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: APK 이름 정리
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          DEST="volp-${VERSION_NAME}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: volp-apk
          path: ${{ steps.apk.outputs.path }}

      - name: 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests

      # 앱의 자동 업데이트 기능이 이 릴리스를 읽는다. 태그는 v<versionName> 형식을 지킬 것.
      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" "${{ steps.apk.outputs.path }}" \
            --title "볼프 ${VERSION_NAME}" \
            --notes "커밋 ${GITHUB_SHA::7} · 브랜치 ${GITHUB_REF_NAME}" \
            --target "$GITHUB_SHA"

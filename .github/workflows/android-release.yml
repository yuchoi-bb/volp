name: Android Release

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4

      - name: 서명 키스토어 복원
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 시크릿이 없어 디버그 키로 빌드한다." >&2
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/volp-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/volp-release.jks" >> "$GITHUB_ENV"

      # 없으면 기기 동기화 없이 빌드된다. 앱은 BuildConfig.HAS_FIREBASE로 그 사정을 안다.
      - name: Firebase 설정 복원
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON 시크릿이 없어 기기 동기화 없이 빌드한다." >&2
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: 단위 테스트
        run: ./gradlew --no-daemon testSafeReleaseUnitTest

      - name: 릴리스 APK 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew --no-daemon assembleSafeRelease assembleFullRelease

      # 두 빌드는 권한만 다르다. 이름으로 갈라 두지 않으면 어느 것을 받았는지 알 수 없다.
      - name: APK 이름 정리
        id: apk
        run: |
          SAFE=$(find app/build/outputs/apk/safe/release -name '*.apk' | head -n 1)
          FULL=$(find app/build/outputs/apk/full/release -name '*.apk' | head -n 1)
          cp "$SAFE" "volp-safe-${VERSION_NAME}.apk"
          cp "$FULL" "volp-full-${VERSION_NAME}.apk"
          echo "safe=volp-safe-${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "full=volp-full-${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: volp-apk
          path: |
            ${{ steps.apk.outputs.safe }}
            ${{ steps.apk.outputs.full }}

      - name: 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests

      # 앱의 자동 업데이트 기능이 이 릴리스를 읽는다. 태그는 v<versionName> 형식을 지킬 것.
      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          ### 어느 것을 받아야 하나

          **volp-safe** — 평소 쓰는 빌드. 문자·알림 읽기와 앱 설치 권한이 없어 그냥 설치된다.
          카드 결제는 결제 문자를 길게 눌러 Volp로 공유하면 들어온다.

          **volp-full** — 카드 문자와 알림을 저절로 모으는 빌드. 권한 지문이 보이스피싱 앱과
          같아 기기가 설치를 막으므로 PC에서 `adb install -r <파일>`로 넣어야 한다.

          둘은 서명과 패키지가 같아 서로 덮어써도 기록이 그대로 이어진다.
          NOTES
          printf '\n커밋 %s · 브랜치 %s\n' "${GITHUB_SHA::7}" "$GITHUB_REF_NAME" >> release-notes.md
          gh release create "v${VERSION_NAME}" \
            "${{ steps.apk.outputs.safe }}" "${{ steps.apk.outputs.full }}" \
            --title "볼프 ${VERSION_NAME}" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
